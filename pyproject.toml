[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stageflow"
version = "0.8.0"
description = "Micro/in-process Python DAG workflow engine — stdlib only, zero runtime deps, in your process"
authors = [{ name = "ebziw" }]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "dag", "workflow", "orchestration", "pipeline", "llm",
    "checkpoint", "resume", "durable-execution", "stageflow",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ebziw/stageflow"
Repository = "https://github.com/ebziw/stageflow"
Changelog = "https://github.com/ebziw/stageflow/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
stageflow = "stageflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["stageflow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

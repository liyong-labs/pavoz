[project]
name = "stageflow"
version = "0.1.3"
description = "LLM/SE/Extract 流程编排系统 — micro/in-process workflow engine"
authors = [{ name = "ebziw" }]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "moto[s3]>=5.0",
    "fakeredis>=2.20",
    "psycopg[binary]>=3.1",
    "pymysql>=1.1",
    "redis>=5.0",
    "boto3>=1.34",
]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["pymysql>=1.1"]
redis = ["redis>=5.0"]
minio = ["boto3>=1.34"]
sqlite = []  # stdlib, always available
contrib = ["psycopg[binary]>=3.1", "pymysql>=1.1", "redis>=5.0", "boto3>=1.34"]
all = ["psycopg[binary]>=3.1", "pymysql>=1.1", "redis>=5.0", "boto3>=1.34"]

[tool.setuptools]
packages = ["stageflow", "stageflow.contrib", "stageflow.contrib.storage"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: requires docker (postgres / mysql) — run locally with `docker compose up`",
]

[tool.ruff]
line-length = 110
target-version = "py312"
